# Focused source-bound checks; does not replace the legacy workspace/defaults.
[workspace]
[package]
name = "silk-f04-testnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "BSD-3-Clause"
publish = false

[[bin]]
name = "silk-f04-testnet"
path = "../../crates/silk-f04-testnet/src/main.rs"

[[test]]
name = "range_component"
path = "range_component.rs"

[dependencies]
silk-f04-node = { path = "../../crates/silk-f04-node" }
silk-sapling-f04 = { path = "../../crates/silk-sapling-f04" }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
hex = "0.4"
libc = "0.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
