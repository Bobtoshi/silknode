[package]
name = "silk-sapling-f04"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
sapling-crypto = { version = "=0.7.0", default-features = false, features = ["circuit"] }
bellman = { version = "=0.14.0", default-features = false, features = ["groth16"] }
bls12_381 = "=0.8.0"
jubjub = "=0.10.0"
redjubjub = { version = "=0.8.0", default-features = false, features = ["std"] }
ff = "0.13"
group = "0.13"
rand_core = { version = "0.6.4", features = ["getrandom"] }
incrementalmerkletree = { version = "0.8.1", features = ["legacy-api"] }
zcash_note_encryption = "0.4"
blake2b_simd = "1"
sha2.workspace = true
thiserror.workspace = true
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
