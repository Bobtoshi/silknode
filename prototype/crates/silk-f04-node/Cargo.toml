[package]
name = "silk-f04-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
silk-sapling-f04 = { path = "../silk-sapling-f04" }
silk-order = { path = "../silk-order" }
silk-pow = { path = "../silk-pow" }
silk-types = { path = "../silk-types" }
silk-randomx = { path = "../silk-randomx" }
sapling-crypto = { version = "=0.7.0", default-features = false, features = ["circuit"] }
incrementalmerkletree = { version = "0.8.1", features = ["legacy-api"] }
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
rand_core = { version = "0.6.4", features = ["getrandom"] }
sha2.workspace = true
thiserror.workspace = true
hex = "0.4"
libc = "0.2"
fs2 = "0.4"
rustix = { version = "=1.1.4", features = ["time", "fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "time"] }

[dev-dependencies]
tempfile = "3"
zcash_note_encryption = { version = "=0.4.2", default-features = false, features = ["alloc"] }

[lints]
workspace = true
